[project]
name = "pixtract"
version = "0.0.1"
description = "Fast raster point extraction via tile-grouped reads"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Michael Sumner" },
]
dependencies = [
    "numpy",
    #"gdal", osgeo.gdal is required but we don't want to build it or install from binary (WIP)
]

[project.optional-dependencies]
rio = ["rasterio"]
dev = ["pytest", "rasterio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixtract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
