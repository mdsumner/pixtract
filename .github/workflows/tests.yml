name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's GDAL, numpy and rasterio are built against each other, so use
      # the system Python rather than pip wheels (numpy 2 breaks gdal_array).
      - name: Install GDAL and test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-gdal python3-numpy python3-pytest python3-rasterio

      # conftest.py skips everything if osgeo.gdal is missing; fail loudly instead.
      - name: Check GDAL bindings
        run: /usr/bin/python3 -c "from osgeo import gdal; import rasterio; print('GDAL', gdal.__version__, 'rasterio', rasterio.__version__)"

      - name: Run pytest
        run: /usr/bin/python3 -m pytest -v -rs tests

  r:
    name: R (tests/test_r.R)
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::gdalraster
            any::xml2

      - name: Run R tests
        run: Rscript tests/test_r.R
